<!-- Wishlist Basic -->
<a [routerLink]="['/wishlist']" class="btn p-0 position-relative header-wishlist" *ngIf="style == 'basic'">
    <svg class="cfb-ico cfb-ico--heart" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </svg>
    <span class="position-absolute top-0 start-100 translate-middle badge" *ngIf="(wishlist$ | async)?.total">
        {{ (wishlist$ | async)?.total }} <span class="visually-hidden">{{ 'unread_messages' | translate }}</span>
    </span>
</a>

<!-- Wishlist Classic -->
<a [routerLink]="['/wishlist']" class="header-icon bag-icon" *ngIf="style == 'classic'">
    <small class="badge-number badge-light" *ngIf="(wishlist$ | async)?.total">{{ (wishlist$ | async)?.total }}</small>
    <i class="ri-heart-line"></i>
</a>
