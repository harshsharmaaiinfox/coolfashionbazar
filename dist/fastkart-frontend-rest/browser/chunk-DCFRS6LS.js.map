<section class="kfa-page">
  <div class="kfa-center">
    <div class="kfa-right">
      <div class="kfa-form-wrap">
        <app-alert></app-alert>

        <!-- Header -->
        <div class="kfa-form-head">
          <div class="kfa-lock-icon">
            <i class="ri-lock-password-line"></i>
          </div>
          <p class="kfa-eyebrow kfa-eyebrow--dark">Security</p>
          <h2>Set a new password</h2>
          <p class="kfa-head-sub">Choose a strong password you haven't used before.</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="kfa-form">

          <!-- New Password -->
          <div class="kfa-field">
            <label for="newPassword">{{ 'new_password' | translate }}</label>
            <div class="kfa-input-wrap">
              <i class="ri-lock-line kfa-input-icon"></i>
              <input type="password" id="newPassword" formControlName="newPassword"
                placeholder="••••••••"
                [class.kfa-input-error]="form.controls['newPassword'].touched && form.controls['newPassword'].invalid">
            </div>
            <span class="kfa-error" *ngIf="form.controls['newPassword'].touched && form.controls['newPassword'].errors?.['required']">
              {{ 'new_password_is_required' | translate }}
            </span>
          </div>

          <!-- Confirm Password -->
          <div class="kfa-field">
            <label for="confirmPassword">{{ 'confirm_password' | translate }}</label>
            <div class="kfa-input-wrap">
              <i class="ri-shield-check-line kfa-input-icon"></i>
              <input type="password" id="confirmPassword" formControlName="confirmPassword"
                placeholder="••••••••"
                [class.kfa-input-error]="form.controls['confirmPassword'].touched && form.controls['confirmPassword'].invalid">
            </div>
            <span class="kfa-error" *ngIf="form.controls['confirmPassword'].touched && form.controls['confirmPassword'].errors?.['required']">
              {{ 'confirm_password_is_required' | translate }}
            </span>
          </div>

          <!-- Submit -->
          <app-button [id]="'confirm_pass_btn'" [class]="'kfa-submit-btn'">
            {{ 'submit' | translate }} <i class="ri-check-line"></i>
          </app-button>

        </form>

        <div class="kfa-alt-link">
          <span>Remember your password?</span>
          <a [routerLink]="['/auth/login']">Back to Login <i class="ri-arrow-right-line"></i></a>
        </div>

      </div>
    </div>
  </div>
</section>
