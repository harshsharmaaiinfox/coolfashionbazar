<section class="kfa-page">
  <div class="kfa-center">

    <!-- CENTERED FORM PANEL -->
    <div class="kfa-right">
      <div class="kfa-form-wrap">
        <app-alert></app-alert>

        <div class="kfa-form-head">
          <p class="kfa-eyebrow kfa-eyebrow--dark">Forgot Password</p>
          <h2>Reset your password</h2>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="kfa-form">

          <!-- Email -->
          <div class="kfa-field">
            <label for="email">{{ 'Email Address' | translate }}</label>
            <input type="email" id="email" formControlName="email"
              placeholder="{{ 'enter_your_email' | translate }}"
              (input)="filterEmailCharacters($event)"
              pattern="[a-zA-Z0-9._\-+@]+"
              [class.kfa-input-error]="form.controls['email'].touched && form.controls['email'].invalid">
            <span class="kfa-error" *ngIf="form.controls['email'].touched && form.controls['email'].errors?.['required']">
              {{ 'Email Is Required' | translate }}
            </span>
            <span class="kfa-error" *ngIf="form.controls['email'].touched && form.controls['email'].errors?.['email']">
              {{ 'Invalid Email' | translate }}
            </span>
          </div>

          <!-- ReCaptcha -->
          <div class="kfa-field" *ngIf="reCaptcha">
            <re-captcha formControlName="recaptcha"></re-captcha>
            <span class="kfa-error" *ngIf="form.controls['recaptcha']?.touched && form.controls['recaptcha']?.errors?.['required']">
              {{ 'ReCaptcha is Required' | translate }}
            </span>
          </div>

          <!-- Submit -->
          <app-button [id]="'forgot_btn'" [class]="'kfa-submit-btn'">
            {{ 'Send Reset Link' | translate }} <i class="ri-mail-send-line"></i>
          </app-button>

        </form>

        <div class="kfa-alt-link">
          <span>{{ 'Remember Your Password' | translate }}?</span>
          <a [routerLink]="['/auth/login']">{{ 'Back to Login' | translate }} <i class="ri-arrow-right-line"></i></a>
        </div>
      </div>
    </div>

  </div>
</section>
